[package]
name = "agent-bridge"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Drive Claude Code, Codex, and Cursor from one surface"
default-run = "agent-bridge"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
acp-host = { path = "../crates/acp-host" }
canonical = { path = "../crates/canonical" }
projection = { path = "../crates/projection" }
handoff = { path = "../crates/handoff" }
profile = { path = "../crates/profile" }
secrets = { path = "../crates/secrets" }
tauri = { version = "2", features = [] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lib]
name = "agent_bridge_lib"
crate-type = ["lib"]
